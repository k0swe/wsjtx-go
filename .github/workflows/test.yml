name: Test

on: [push, pull_request]

jobs:
  test:
    name: Run unit tests
    runs-on: ubuntu-latest

    steps:
      - name: Install Go
        uses: actions/setup-go@v7
        with:
          # https://packages.debian.org/bookworm/golang
          go-version: 1.27.x

      - name: Checkout code
        uses: actions/checkout@v7

      - name: Test
        run: go test ./...

      - name: Vet
        run: go vet ./...
