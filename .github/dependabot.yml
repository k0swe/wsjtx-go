version: 2

# Dependabot handles SECURITY updates only.
# Routine version updates are Renovate's job - it groups version-locked
# families (Angular monorepo, Expo SDK, React Native) correctly using its
# maintained presets, with no per-repo patterns to hand-maintain.
#
# open-pull-requests-limit: 0 disables VERSION updates; per GitHub's docs it
# has no effect on security updates.
# applies-to: security-updates is required because groups otherwise default
# to version-updates and would silently do nothing here.

updates:
  - package-ecosystem: gomod
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
    groups:
      gomod-security:
        applies-to: security-updates
        patterns:
          - "*"

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
    groups:
      actions-security:
        applies-to: security-updates
        patterns:
          - "*"
